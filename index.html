<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a111d">
  <meta name="description" content="A・B・Cのテンポを好きな順番に並べ、ワンタッチで即時切り替えるメトロノーム。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="テンポスイッチ">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="color-scheme" content="dark">
  <title>テンポスイッチ | ワンタッチ・メトロノーム</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./app.js"></script>
</head>
<body>
  <main class="app" id="app">
    <!-- 1 / three tempo presets -->
    <section class="region region-top" aria-labelledby="tempo-heading">
      <div class="brand-row">
        <div class="brand">
          <span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 28 28" fill="none"><path d="M4 18V10M10.5 23V5M17 19V9M23.5 15V13" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg></span>
          <span class="brand-title">TEMPO<span> SWITCH</span></span>
        </div>
        <span class="brand-caption">LIVE METRONOME</span>
      </div>
      <div class="section-heading">
        <h1 id="tempo-heading"><span class="section-index">01</span> テンポを設定</h1>
        <span class="section-help">30–300 BPM</span>
      </div>
      <div class="tempo-grid">
        <div class="tempo-card tempo-a" data-preset="A">
          <div class="tempo-letter">A</div>
          <div class="tempo-adjust">
            <button class="adjust-btn" type="button" data-adjust="A" data-delta="-1" aria-label="AのBPMを1下げる">−</button>
            <div class="tempo-value"><input id="bpmA" type="number" min="30" max="300" step="1" inputmode="numeric" aria-label="AのBPM" value="100"><span>BPM</span></div>
            <button class="adjust-btn" type="button" data-adjust="A" data-delta="1" aria-label="AのBPMを1上げる">＋</button>
          </div>
        </div>
        <div class="tempo-card tempo-b" data-preset="B">
          <div class="tempo-letter">B</div>
          <div class="tempo-adjust">
            <button class="adjust-btn" type="button" data-adjust="B" data-delta="-1" aria-label="BのBPMを1下げる">−</button>
            <div class="tempo-value"><input id="bpmB" type="number" min="30" max="300" step="1" inputmode="numeric" aria-label="BのBPM" value="120"><span>BPM</span></div>
            <button class="adjust-btn" type="button" data-adjust="B" data-delta="1" aria-label="BのBPMを1上げる">＋</button>
          </div>
        </div>
        <div class="tempo-card tempo-c" data-preset="C">
          <div class="tempo-letter">C</div>
          <div class="tempo-adjust">
            <button class="adjust-btn" type="button" data-adjust="C" data-delta="-1" aria-label="CのBPMを1下げる">−</button>
            <div class="tempo-value"><input id="bpmC" type="number" min="30" max="300" step="1" inputmode="numeric" aria-label="CのBPM" value="110"><span>BPM</span></div>
            <button class="adjust-btn" type="button" data-adjust="C" data-delta="1" aria-label="CのBPMを1上げる">＋</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 2 / sequence editor -->
    <section class="region region-middle" aria-labelledby="sequence-heading">
      <div class="section-heading">
        <h2 id="sequence-heading"><span class="section-index">02</span> 切り替え順を作る</h2>
        <span class="sequence-count" id="sequence-count">10 STEPS</span>
      </div>
      <div class="sequence-editor" id="sequence-editor">
        <div class="sequence-list" id="sequence-list" aria-label="設定したテンポの順番"></div>
      </div>
      <div class="sequence-toolbar">
        <div class="add-buttons" aria-label="テンポを末尾に追加">
          <button type="button" class="add-btn add-a" data-add="A" aria-label="末尾にテンポAを追加"><span>＋</span>A</button>
          <button type="button" class="add-btn add-b" data-add="B" aria-label="末尾にテンポBを追加"><span>＋</span>B</button>
          <button type="button" class="add-btn add-c" data-add="C" aria-label="末尾にテンポCを追加"><span>＋</span>C</button>
        </div>
        <div class="edit-buttons">
          <button type="button" class="minor-btn" id="undo-btn" aria-label="最後の編集を元に戻す" title="元に戻す">↶ <span>戻す</span></button>
          <button type="button" class="minor-btn" id="clear-btn">全消去</button>
        </div>
      </div>
      <p class="editor-hint">A / B / C で追加 ・ 並んだ文字をタップして削除</p>
    </section>

    <!-- 3 / live performance -->
    <section class="region region-bottom" aria-labelledby="live-heading">
      <div class="section-heading live-heading">
        <h2 id="live-heading"><span class="section-index">03</span> ワンタッチ切り替え</h2>
        <span id="playback-status" class="status-pill"><span class="status-dot"></span>停止中</span>
      </div>
      <div class="current-row">
        <div class="current-tempo" id="current-tempo">
          <div class="current-kicker">CURRENT TEMPO</div>
          <div class="current-main"><span class="current-letter" id="current-letter">—</span><strong class="current-bpm" id="current-bpm">—</strong><span class="bpm-unit">BPM</span></div>
        </div>
        <div class="beat-panel" aria-label="4拍のビジュアル表示">
          <span class="beat-label">BEAT</span>
          <div class="beat-dots" id="beat-dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
          <span class="step-progress" id="step-progress">0 / 10</span>
        </div>
      </div>
      <div class="action-group">
        <div class="up-next"><span class="up-next-label">NEXT</span><span id="next-caption">B · 120 BPM</span><span class="wrap-note" id="wrap-note"></span></div>
        <button class="action-button" id="advance-btn" type="button" data-letter="B">
          <span class="action-copy"><span id="action-label" class="action-label">再生スタート</span><span id="action-detail" class="action-detail">B · 120 BPM</span></span>
          <span class="action-arrow" id="action-arrow" aria-hidden="true">▶</span>
        </button>
      </div>
      <div class="live-footer">
        <button class="tool-button" id="stop-btn" type="button" disabled><span aria-hidden="true">■</span> 停止・先頭へ</button>
        <button class="tool-button" id="sound-btn" type="button" aria-pressed="true"><span aria-hidden="true" id="sound-icon">♫</span> <span id="sound-label">音 ON</span></button>
        <span class="footer-note">最後は先頭にループ</span>
      </div>
      <div class="visually-hidden" id="screenreader-announcement" role="status" aria-live="polite"></div>
    </section>
  </main>
</body>
</html>
